name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
      - name: Vet
        run: go vet ./...
      - name: Build
        run: CGO_ENABLED=0 go build ./...
      - name: Test
        run: go test ./... -count=1 -timeout 120s -coverprofile=coverage.out
      - name: Coverage
        run: go tool cover -func=coverage.out | tail -1
      - name: 依赖面门禁（纯判据包不得链数据库驱动）
        run: bash scripts/check-dep-edges.sh

  race:
    name: race（并发面竞态检测）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
      # ★ -race 在 Linux 上**强制要求 cgo**（CGO_ENABLED=0 直接报
      #   「-race requires cgo」）⇒ 显式写 1，别让全局开关把它关掉。
      # 本作业没有 PG service ⇒ PG 判据用例显式 skip（不伪造结果）。
      - name: Race
        run: CGO_ENABLED=1 go test -race ./... -count=1 -timeout 600s

  integration:
    name: integration（PG 参考实现：kernel 共享契约套件 + SIGKILL e2e）
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gakref
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gakref"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: PG 契约套件 + 故障恢复 e2e（硬失败，无环境开洞；判据本体归 kernel sidetest/boardtest）
        env:
          GAK_PGREF_DSN: postgres://postgres:postgres@localhost:5432/gakref?sslmode=disable
        run: |
          CGO_ENABLED=0 go test ./pgstore/ -count=1 -timeout 15m -v

      - name: cluster 高可用集成（真 PG：双副本抢占 / 崩溃接管不重复施加）
        env:
          GAK_PGREF_DSN: postgres://postgres:postgres@localhost:5432/gakref?sslmode=disable
        run: |
          CGO_ENABLED=0 go test ./cluster/ -count=1 -timeout 15m -v

  site-links:
    name: 站点内部链接门禁（正文链接自带 base + 目标页面存在）
    # 子路径部署（base=/goagent-runtime/）下，markdown 正文链接是原生 <a href>，
    # 框架不加工 base ⇒ 写成 '/guide/x.html' 会被解析到站点根之外 ⇒ 404。
    # 判据本体在 site/scripts/check-links.mjs（失败形态是变红），build 前置同一份。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 内部链接检查（子路径部署下的 404 防线）
        run: node site/scripts/check-links.mjs

  changelog:
    name: CHANGELOG 同步校验（与 git 历史对账）
    # CHANGELOG.md 由家族工具 matrix-tools/scripts/gen_changelogs.py 从 git 历史生成，
    # 本仓不自研第二份生成器。工具钉在下面这个 SHA——上游改动不得把本仓 CI 弄红。
    # 判据口径是「覆盖级」：提交版可以更丰富（手写发布说明留着），缺内容则红。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 —— 生成器要读全部 tag，浅克隆只有 0 个 tag
          fetch-depth: 0
      - name: 取家族工具（钉住版本）
        run: |
          git clone --quiet https://github.com/oagentkit/matrix-tools.git /tmp/matrix-tools
          cd /tmp/matrix-tools
          git checkout --quiet efa5dea012ce9b7843cda282eb74cf712099d76a
      - name: CHANGELOG 与 git 历史对账
        run: python3 /tmp/matrix-tools/scripts/gen_changelogs.py --repo goagent-runtime --root "$GITHUB_WORKSPACE/.." --check

  site:
    name: 站点构建（生成页同步 + 链接门禁 + 构建）
    # 站点的「机器事实 / 门禁体系 / 坑速查」三页是**生成物**：由
    # site/scripts/gen_reference_pages.mjs 从仓库事实（磁盘包目录 / go.mod /
    # Makefile / ci.yml / 坑表数据）生成。判据本体是生成器的 --check 模式——
    # 生成物与事实对不上即非零退出（失败形态是变红，不是变绿）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: 生成页同步校验（生成物与仓库事实不同步即红）
        run: node site/scripts/gen_reference_pages.mjs --check
      - name: 站点构建（含内部链接门禁）
        working-directory: site
        run: npm ci && npm run build
